name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (package com.nextel.app)
        run: |
          flutter create --platforms=android --org com.nextel --project-name gifttok .
          OLD=com.nextel.gifttok
          NEW=com.nextel.app
          grep -rl "$OLD" android | xargs sed -i "s/$OLD/$NEW/g"
          KT=$(find android/app/src/main -name MainActivity.kt)
          DIR=$(dirname "$KT")
          mkdir -p "$(dirname "$DIR")/app"
          mv "$KT" "$(dirname "$DIR")/app/MainActivity.kt"
          rmdir "$DIR" 2>/dev/null || true
          sed -i 's/android:label="[^"]*"/android:label="GiftTok"/' android/app/src/main/AndroidManifest.xml

      - name: Set up signing (only if keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret found. Building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 - <<'PY'
          import os
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if not os.path.exists(name):
                  continue
              s = open(name).read()
              if name.endswith(".kts"):
                  props = ('val keystoreProperties = java.util.Properties()\n'
                           'keystoreProperties.load(java.io.FileInputStream(rootProject.file("key.properties")))\n\n')
                  cfg = ('    signingConfigs {\n        create("release") {\n'
                         '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                         '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                         '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                         '            storePassword = keystoreProperties["storePassword"] as String\n'
                         '        }\n    }\n\n')
                  s = s.replace("android {", props + "android {", 1)
                  s = s.replace("    buildTypes {", cfg + "    buildTypes {", 1)
                  s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              else:
                  props = ('def keystoreProperties = new Properties()\n'
                           'keystoreProperties.load(new FileInputStream(rootProject.file("key.properties")))\n\n')
                  cfg = ('    signingConfigs {\n        release {\n'
                         '            keyAlias keystoreProperties["keyAlias"]\n'
                         '            keyPassword keystoreProperties["keyPassword"]\n'
                         '            storeFile file(keystoreProperties["storeFile"])\n'
                         '            storePassword keystoreProperties["storePassword"]\n'
                         '        }\n    }\n\n')
                  s = s.replace("android {", props + "android {", 1)
                  s = s.replace("    buildTypes {", cfg + "    buildTypes {", 1)
                  s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              open(name, "w").write(s)
          PY

      - run: flutter pub get

      - name: Build APK (one file per phone type, small)
        run: flutter build apk --release --split-per-abi --build-number=$(( ($(date +%s) - 1700000000) / 60 ))

      - name: Build app bundle (for Play Store)
        run: flutter build appbundle --release --build-number=$(( ($(date +%s) - 1700000000) / 60 ))

      - uses: actions/upload-artifact@v4
        with:
          name: gifttok-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gifttok-aab
          path: build/app/outputs/bundle/release/app-release.aab
