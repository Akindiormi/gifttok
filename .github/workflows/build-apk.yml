name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (package com.nextel.app)
        run: |
          flutter create --platforms=android --org com.nextel --project-name gifttok .
          OLD=com.nextel.gifttok
          NEW=com.nextel.app
          grep -rl "$OLD" android | xargs sed -i "s/$OLD/$NEW/g"
          KT=$(find android/app/src/main -name MainActivity.kt)
          DIR=$(dirname "$KT")
          mkdir -p "$(dirname "$DIR")/app"
          mv "$KT" "$(dirname "$DIR")/app/MainActivity.kt"
          rmdir "$DIR" 2>/dev/null || true
          sed -i 's/android:label="[^"]*"/android:label="GiftTok"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK (one file per phone type, small)
        run: flutter build apk --release --split-per-abi

      - name: Build app bundle (for Play Store)
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: gifttok-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gifttok-aab
          path: build/app/outputs/bundle/release/app-release.aab
